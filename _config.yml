title: Red Truck Adventures
description: "Documenting real places, real drives, and real stories from the Pacific Northwest."
# Replace USERNAME with your GitHub username. For local dev run: bundle exec jekyll serve --baseurl ""
url: "https://JohnPJustice.github.io"
baseurl: "/red-truck-adventures"

# Author / SEO
author:
  name: Red Truck Adventures
  twitter: RedTruckAdv

og_image: "https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1200&q=80"

# Clean URLs
permalink: pretty

# Build settings
markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Collections
collections:
  adventures:
    output: true
    permalink: /adventures/:name/
  gear:
    output: true
    permalink: /gear/:name/
  stories:
    output: true
    permalink: /stories/:name/

# Default front matter
defaults:
  - scope:
      path: ""
      type: adventures
    values:
      layout: adventure
  - scope:
      path: ""
      type: gear
    values:
      layout: gear
  - scope:
      path: ""
      type: stories
    values:
      layout: story
  - scope:
      path: ""
      type: pages
    values:
      layout: page

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - README.md
  - "*.sh"
