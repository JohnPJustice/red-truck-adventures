<header class="site-header" id="site-header">
  <nav class="nav" aria-label="Main navigation">

    <!-- Logo -->
    <a href="{{ '/' | prepend: site.baseurl }}" class="nav__logo" aria-label="Red Truck Adventures home">
      <div class="nav__logo-icon" aria-hidden="true">
        <svg viewBox="0 0 447 222" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="12">
            <path d="M436.06,150.45l-2.92-9.39-.32-58.31-17.01-12.72-17.43.13c-5.18.04-10.12-.48-15.23-.46-13.29.06-26.12.92-39.52.14-2.93-.17-6.89.24-9.26-2.79l-44.85-57.44c-2.22-2.84-5.05-5.91-8.97-5.92l-99.29-.05c-2.59,0-4.78,2.53-4.77,5.05l.09,55.74.51,106.21"/>
            <path d="M173.41,70.55c-1.32.17-2.75-.58-3.93-.8l-45.86.12-84.8-.03c-6.93,0-13.23-.85-20.13.38s-7.2,7.19-8.44,14.11c-1.56,13.23-.66,26.03-1.35,39.21-.27,5.12.62,9.56.82,14.45.22,5.17-11.37,23.71-3.1,31.71,3.59,3.47,8,4.52,13.09,3.96,5.28-.57,22.12,1.1,28.67-.28"/>
            <path d="M437.04,151.3c3.54,2.24,5.91,4.28,6.11,8.97.25,5.84-1.77,13.63-9.25,13.62-17.99-.03-35.7-.62-53.31.41"/>
            <polyline points="139.66 174.3 172.16 173.39 289.33 174.3"/>
            <path d="M137.82,175.15c.58-25.26-19.48-44.43-43.18-44.76s-43.74,18.84-44.28,42.76,18.29,43.98,42.28,44.74c23.7.75,44.61-17.47,45.19-42.74Z"/>
            <path d="M378.65,175.11c.58-25.22-19.38-44.39-43.04-44.86-23.96-.47-43.8,18.49-44.62,42.36s17.69,44.14,41.62,45.31c24.03,1.17,45.45-17.19,46.04-42.81Z"/>
          </g>
        </svg>
      </div>
      <div class="nav__logo-text">
        <span class="brand-name">Red Truck Adventures</span>
        <span class="brand-tagline">Pacific Northwest</span>
      </div>
    </a>

    <!-- Desktop links -->
    <ul class="nav__links" role="list">
      <li class="nav__link">
        <a href="{{ '/' | prepend: site.baseurl }}"
           {% if page.url == '/' %}class="active"{% endif %}>Home</a>
      </li>
      <li class="nav__link">
        <a href="{{ '/adventures/' | prepend: site.baseurl }}"
           {% if page.url contains '/adventures' %}class="active"{% endif %}>Adventures</a>
      </li>
      <li class="nav__link">
        <a href="{{ '/gear-reviews/' | prepend: site.baseurl }}"
           {% if page.url contains '/gear' %}class="active"{% endif %}>Gear</a>
      </li>
      <li class="nav__link">
        <a href="{{ '/shop/' | prepend: site.baseurl }}"
           {% if page.url contains '/shop' %}class="active"{% endif %}>Shop</a>
      </li>
      <li class="nav__link">
        <a href="{{ '/pnw-stories/' | prepend: site.baseurl }}"
           {% if page.url contains '/pnw-stories' or page.url contains '/stories/' %}class="active"{% endif %}>Stories</a>
      </li>
      <li class="nav__link">
        <a href="{{ '/about/' | prepend: site.baseurl }}"
           {% if page.url contains '/about' %}class="active"{% endif %}>About</a>
      </li>
      <li class="nav__link nav__link--cta">
        <a href="{{ '/contact/' | prepend: site.baseurl }}"
           {% if page.url contains '/contact' %}class="active"{% endif %}>Contact</a>
      </li>
    </ul>

    <!-- Hamburger -->
    <button class="nav__hamburger"
            id="nav-toggle"
            aria-label="Toggle navigation menu"
            aria-expanded="false"
            aria-controls="nav-mobile">
      <span></span>
      <span></span>
      <span></span>
    </button>

  </nav>

  <!-- Mobile dropdown -->
  <nav class="nav__mobile" id="nav-mobile" aria-label="Mobile navigation">
    <a href="{{ '/' | prepend: site.baseurl }}">Home</a>
    <a href="{{ '/adventures/' | prepend: site.baseurl }}">Adventures</a>
    <a href="{{ '/gear-reviews/' | prepend: site.baseurl }}">Gear Reviews</a>
    <a href="{{ '/shop/' | prepend: site.baseurl }}">Digital Shop</a>
    <a href="{{ '/pnw-stories/' | prepend: site.baseurl }}">PNW Stories</a>
    <a href="{{ '/about/' | prepend: site.baseurl }}">About</a>
    <a href="{{ '/contact/' | prepend: site.baseurl }}">Contact</a>
  </nav>

</header>
